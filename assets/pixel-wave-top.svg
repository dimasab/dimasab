      <rect x="672" y="60" width="8" height="8" fill="#60A5FA"/>
      <rect x="684" y="66" width="8" height="8" fill="#38BDF8"/>
      <rect x="696" y="74" width="8" height="8" fill="#22D3EE"/>
      <rect x="708" y="82" width="8" height="8" fill="#06B6D4"/>
      <rect x="720" y="90" width="8" height="8" fill="#06B6D4"/>
    </g>
  </defs>

  <g opacity="0.95">
    <use href="#wave"/>
    <use href="#wave" x="720"/>
    <use href="#wave" x="-720"/>

    <animateTransform
      attributeName="transform"
      type="translate"
      from="0 0"
      to="-720 0"
      dur="7s"
      repeatCount="indefinite"/>
  </g>

  <!-- Small floating pixels -->
  <g opacity="0.55">
    <rect x="120" y="28" width="6" height="6" fill="#22D3EE">
      <animate attributeName="y" values="28;18;28" dur="3s" repeatCount="indefinite"/>
    </rect>

    <rect x="340" y="22" width="5" height="5" fill="#8B5CF6">
      <animate attributeName="y" values="22;32;22" dur="4s" repeatCount="indefinite"/>
    </rect>

    <rect x="870" y="34" width="6" height="6" fill="#38BDF8">
      <animate attributeName="y" values="34;24;34" dur="3.5s" repeatCount="indefinite"/>
    </rect>

    <rect x="1050" y="24" width="5" height="5" fill="#A78BFA">
      <animate attributeName="y" values="24;36;24" dur="4.5s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
