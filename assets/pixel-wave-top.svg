      <rect x="24"  y="66" width="8" height="8" fill="#38BDF8"/>
      <rect x="36"  y="58" width="8" height="8" fill="#38BDF8"/>
      <rect x="48"  y="52" width="8" height="8" fill="#60A5FA"/>
      <rect x="60"  y="48" width="8" height="8" fill="#60A5FA"/>
      <rect x="72"  y="44" width="8" height="8" fill="#3B82F6"/>
      <rect x="84"  y="42" width="8" height="8" fill="#3B82F6"/>
      <rect x="96"  y="44" width="8" height="8" fill="#60A5FA"/>
      <rect x="108" y="48" width="8" height="8" fill="#60A5FA"/>
      <rect x="120" y="54" width="8" height="8" fill="#38BDF8"/>
      <rect x="132" y="62" width="8" height="8" fill="#22D3EE"/>
      <rect x="144" y="70" width="8" height="8" fill="#22D3EE"/>
      <rect x="156" y="78" width="8" height="8" fill="#06B6D4"/>
      <rect x="168" y="86" width="8" height="8" fill="#06B6D4"/>

      <!-- Purple -->
      <rect x="180" y="94" width="8" height="8" fill="#8B5CF6"/>
      <rect x="192" y="102" width="8" height="8" fill="#8B5CF6"/>
      <rect x="204" y="110" width="8" height="8" fill="#A78BFA"/>
      <rect x="216" y="116" width="8" height="8" fill="#A78BFA"/>
      <rect x="228" y="120" width="8" height="8" fill="#8B5CF6"/>
      <rect x="240" y="122" width="8" height="8" fill="#7C3AED"/>
      <rect x="252" y="120" width="8" height="8" fill="#8B5CF6"/>
      <rect x="264" y="116" width="8" height="8" fill="#A78BFA"/>
      <rect x="276" y="110" width="8" height="8" fill="#A78BFA"/>
      <rect x="288" y="102" width="8" height="8" fill="#8B5CF6"/>
      <rect x="300" y="94" width="8" height="8" fill="#8B5CF6"/>

      <!-- Blue rise -->
      <rect x="312" y="86" width="8" height="8" fill="#3B82F6"/>
      <rect x="324" y="78" width="8" height="8" fill="#3B82F6"/>
      <rect x="336" y="70" width="8" height="8" fill="#60A5FA"/>
      <rect x="348" y="62" width="8" height="8" fill="#60A5FA"/>
      <rect x="360" y="56" width="8" height="8" fill="#38BDF8"/>
      <rect x="372" y="52" width="8" height="8" fill="#38BDF8"/>
      <rect x="384" y="50" width="8" height="8" fill="#22D3EE"/>
      <rect x="396" y="52" width="8" height="8" fill="#22D3EE"/>
      <rect x="408" y="58" width="8" height="8" fill="#38BDF8"/>
      <rect x="420" y="66" width="8" height="8" fill="#60A5FA"/>
      <rect x="432" y="74" width="8" height="8" fill="#60A5FA"/>
      <rect x="444" y="82" width="8" height="8" fill="#3B82F6"/>
      <rect x="456" y="90" width="8" height="8" fill="#3B82F6"/>

      <!-- Purple descent -->
      <rect x="468" y="98" width="8" height="8" fill="#8B5CF6"/>
      <rect x="480" y="106" width="8" height="8" fill="#8B5CF6"/>
      <rect x="492" y="112" width="8" height="8" fill="#A78BFA"/>
      <rect x="504" y="116" width="8" height="8" fill="#A78BFA"/>
      <rect x="516" y="118" width="8" height="8" fill="#8B5CF6"/>
      <rect x="528" y="116" width="8" height="8" fill="#7C3AED"/>
      <rect x="540" y="112" width="8" height="8" fill="#8B5CF6"/>
      <rect x="552" y="106" width="8" height="8" fill="#A78BFA"/>
      <rect x="564" y="98" width="8" height="8" fill="#8B5CF6"/>

      <rect x="576" y="90" width="8" height="8" fill="#22D3EE"/>
      <rect x="588" y="82" width="8" height="8" fill="#22D3EE"/>
      <rect x="600" y="74" width="8" height="8" fill="#38BDF8"/>
      <rect x="612" y="66" width="8" height="8" fill="#38BDF8"/>
